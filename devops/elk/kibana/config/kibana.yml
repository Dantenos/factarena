server.host: "0.0.0.0"
server.port: 5601

telemetry.optIn: false

# Kibana reçoit du HTTPS
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana-server.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana-server.key

# Nginx est le client TLS de Kibana
server.ssl.certificateAuthorities:
  - /usr/share/kibana/config/certs/ca/ca.crt

server.ssl.clientAuthentication: required

# Kibana -> Elasticsearch
elasticsearch.hosts:
  - "https://elasticsearch:9200"

# CA utilisée pour vérifier Elasticsearch
elasticsearch.ssl.certificateAuthorities:
  - /usr/share/kibana/config/certs/ca/ca.crt

# Certificat client présenté par Kibana à Elasticsearch
elasticsearch.ssl.certificate:
  /usr/share/kibana/config/certs/kibana/kibana-client.crt

elasticsearch.ssl.key:
  /usr/share/kibana/config/certs/kibana/kibana-client.key

elasticsearch.ssl.alwaysPresentCertificate: true
elasticsearch.ssl.verificationMode: full

xpack.security.encryptionKey: ${KIBANA_SECURITY_ENCRYPTION_KEY}
xpack.encryptedSavedObjects.encryptionKey: ${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY}
xpack.reporting.encryptionKey: ${KIBANA_REPORTING_ENCRYPTION_KEY}