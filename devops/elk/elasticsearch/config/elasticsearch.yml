# Listen on all network interfaces inside the container.
# Access is restricted by Docker networking and Elasticsearch security.
network.host: 0.0.0.0

# Name of the Elasticsearch cluster.
cluster.name: factarena

# Unique name of this Elasticsearch node.
node.name: elasticsearch

# Our Elasticsearch is deployed as a single-node cluster.
# Data durability is provided through ILM and scheduled snapshots rather than node-level high availability.
discovery.type: single-node

# For HTTPS requests
xpack.security.enabled: true

# HTTPS configurations for clients : Kibana, Logstash, etc.
xpack.security.http.ssl:
  enabled: true
  certificate: certs/elasticsearch/elasticsearch.crt
  key: certs/elasticsearch/elasticsearch.key
  certificate_authorities:
    - certs/ca/ca.crt
# mTLS : every HTTPS client must show a valid certificate
  client_authentication: required

# Elasticsearch's TLS + mTLS transport configuration
xpack.security.transport.ssl:
  enabled: true
  verification_mode: full
  certificate: certs/elasticsearch/elasticsearch.crt
  key: certs/elasticsearch/elasticsearch.key
  certificate_authorities:
    - certs/ca/ca.crt
# mTLS : every HTTPS client must show a valid certificate
  client_authentication: required