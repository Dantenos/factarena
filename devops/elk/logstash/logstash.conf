input {
  gelf {
    id => "docker_gelf"
    port => 12201
    use_udp => true
  }
}

filter {

  # ==========================================================================
  # DOCKER METADATA
  # ==========================================================================

  if [tag] {

    mutate {
      copy => {
        "[tag]" => "[docker][container][name]"
      }
    }
  }

  # ==========================================================================
  # SERVICE NAME
  # ==========================================================================

  if [docker][container][name] {

    # 1. Copier le nom Docker vers service.name
    mutate {
      copy => {
        "[docker][container][name]" => "[service][name]"
      }
    }

    # 2. Supprimer le préfixe Docker Compose
    mutate {
      gsub => [
        "[service][name]", "^transcendence-", ""
      ]
    }

    # 3. Supprimer le suffixe du numéro de conteneur
    mutate {
      gsub => [
        "[service][name]", "-[0-9]+$", ""
      ]
    }
  }

  # ==========================================================================
  # TIMESTAMP GELF
  # ==========================================================================

  if [timestamp] {

    date {
      match => [
        "timestamp",
        "UNIX",
        "UNIX_MS",
        "ISO8601"
      ]

      target => "@timestamp"

      tag_on_failure => [
        "_timestamp_parse_failure"
      ]
    }

    mutate {
      remove_field => [
        "timestamp"
      ]
    }
  }

  # ==========================================================================
  # AUTOMATIC LOG LEVEL DETECTION
  # ==========================================================================

  # --------------------------------------------------------------------------
  # GELF native level
  # --------------------------------------------------------------------------

  if [level] {

    mutate {
      convert => {
        "level" => "string"
      }
    }

    translate {
      field => "level"
      destination => "[log][level]"

      dictionary => {
        "0" => "emergency"
        "1" => "alert"
        "2" => "critical"
        "3" => "error"
        "4" => "warning"
        "5" => "notice"
        "6" => "info"
        "7" => "debug"
      }

      fallback => "unknown"
    }
  }

  # --------------------------------------------------------------------------
  # Text-based level detection
  # --------------------------------------------------------------------------

  if ![log][level] and [message] {

    grok {
      match => {
        "message" => "(?i)^\s*(?<detected_level>TRACE|DEBUG|INFO|NOTICE|WARN(?:ING)?|ERROR|CRITICAL|FATAL|EMERGENCY)\b"
      }

      tag_on_failure => []
    }

    if [detected_level] {

      mutate {
        lowercase => [
          "detected_level"
        ]

        rename => {
          "detected_level" => "[log][level]"
        }
      }
    }
  }

  # ==========================================================================
  # NGINX HTTP ACCESS LOG
  # ==========================================================================

  if [service][name] == "nginx" and [message] {

    grok {
      match => {
        "message" => [
          '%{IPORHOST:[client][address]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][timestamp]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]} %{INT:[http][response][body][bytes]} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"'
        ]
      }

      tag_on_failure => [
        "_nginx_http_parse_failure"
      ]
    }

    # ------------------------------------------------------------------------
    # Nginx timestamp
    # ------------------------------------------------------------------------

    if [nginx][timestamp] {

      date {
        match => [
          "[nginx][timestamp]",
          "dd/MMM/yyyy:HH:mm:ss Z"
        ]

        target => "@timestamp"

        tag_on_failure => [
          "_nginx_timestamp_parse_failure"
        ]
      }
    }

    # ------------------------------------------------------------------------
    # HTTP status
    # ------------------------------------------------------------------------

    if [http][response][status_code] {

      mutate {
        convert => {
          "[http][response][status_code]" => "integer"
          "[http][response][body][bytes]" => "integer"
        }
      }

      mutate {
        add_field => {
          "[event][category]" => "web"
        }
      }

      # ----------------------------------------------------------------------
      # 5xx -> ERROR
      # ----------------------------------------------------------------------

      if [http][response][status_code] >= 500 {

        mutate {
          replace => {
            "[log][level]" => "error"
            "[event][severity]" => "error"
            "[event][type]" => "http_error"
          }
        }

      # ----------------------------------------------------------------------
      # 4xx -> WARNING
      # ----------------------------------------------------------------------

      } else if [http][response][status_code] >= 400 {

        mutate {
          replace => {
            "[log][level]" => "warning"
            "[event][severity]" => "warning"
            "[event][type]" => "http_client_error"
          }
        }

      # ----------------------------------------------------------------------
      # 3xx -> INFO
      # ----------------------------------------------------------------------

      } else if [http][response][status_code] >= 300 {

        mutate {
          replace => {
            "[log][level]" => "info"
            "[event][severity]" => "info"
            "[event][type]" => "http_redirect"
          }
        }

      # ----------------------------------------------------------------------
      # 2xx -> INFO
      # ----------------------------------------------------------------------

      } else {

        mutate {
          replace => {
            "[log][level]" => "info"
            "[event][severity]" => "info"
            "[event][type]" => "http_access"
          }
        }
      }
    }
  }

  # ==========================================================================
  # GENERAL ERROR CLASSIFICATION
  # ==========================================================================

  # On ne fait cette classification que si le log n'est pas déjà
  # un access log HTTP Nginx correctement parsé.

  if ![http][response][status_code] and [message] {

    if [log][level] in [
      "emergency",
      "alert",
      "critical",
      "error",
      "fatal"
    ] {

      mutate {
        replace => {
          "[event][severity]" => "error"
          "[event][type]" => "error"
        }
      }

    } else if [message] =~ /(?i)\b(error|exception|fatal|panic|failed|failure)\b/ {

      mutate {
        replace => {
          "[log][level]" => "error"
          "[event][severity]" => "error"
          "[event][type]" => "error"
        }
      }

    } else if [message] =~ /(?i)\b(warn|warning)\b/ {

      mutate {
        replace => {
          "[log][level]" => "warning"
          "[event][severity]" => "warning"
          "[event][type]" => "warning"
        }
      }

    } else {

      mutate {
        replace => {
          "[event][severity]" => "info"
          "[event][type]" => "log"
        }
      }
    }
  }

  # ==========================================================================
  # COMMON HTTP METADATA
  # ==========================================================================

  if [http][request][method] {

    mutate {
      replace => {
        "[event][category]" => "web"
      }
    }
  }

  # ==========================================================================
  # GENERAL LOG METADATA
  # ==========================================================================

  mutate {
    add_field => {
      "[log][source]" => "docker"
      "[log][collector]" => "logstash"
      "[event][kind]" => "event"
    }
  }

  # ==========================================================================
  # CLEANUP
  # ==========================================================================

  mutate {
    remove_field => [
      "level",
      "level_name",
      "[nginx][timestamp]",
      "detected_level"
    ]
  }
}

output {

  elasticsearch {
    id => "elasticsearch_output"

    hosts => [
      "http://elasticsearch:9200"
    ]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG
  # ==========================================================================

  # À activer temporairement si besoin :
  #
  # stdout {
  #   codec => rubydebug
  # }
}