input {
    pipeline {
        address => "postgres"
    }
}

filter {
    grok {
        match => {
            "message" => "^%{YEAR:[postgres][year]}-%{MONTHNUM:[postgres][month]}-%{MONTHDAY:[postgres][day]} %{TIME:[postgres][time]} %{WORD:[postgres][timezone]} \[%{NUMBER:[process][pid]:int}\] %{WORD:postgres_level}:\s+%{GREEDYDATA:[postgres][message]}$"
        }

        tag_on_failure => ["_postgres_parse_failure"]
    }

    if [postgres][year] {
        mutate {
            add_field => {
                "[postgres][timestamp]" => "%{[postgres][year]}-%{[postgres][month]}-%{[postgres][day]} %{[postgres][time]} %{[postgres][timezone]}"
            }
        }

        date {
            match => [
                "[postgres][timestamp]",
                "yyyy-MM-dd HH:mm:ss.SSS z"
            ]

            target => "@timestamp"
        }
    }

    if [postgres_level] == "LOG" {
        mutate {
            add_field => {
                "[log][level]" => "info"
            }
        }
    }
    else if [postgres_level] == "INFO" {
        mutate {
            add_field => {
                "[log][level]" => "info"
            }
        }
    }
    else if [postgres_level] == "NOTICE" {
        mutate {
            add_field => {
                "[log][level]" => "notice"
            }
        }
    }
    else if [postgres_level] == "WARNING" {
        mutate {
            add_field => {
                "[log][level]" => "warn"
            }
        }
    }
    else if [postgres_level] == "ERROR" {
        mutate {
            add_field => {
                "[log][level]" => "error"
            }
        }
    }
    else if [postgres_level] == "FATAL" {
        mutate {
            add_field => {
                "[log][level]" => "fatal"
            }
        }
    }
    else if [postgres_level] == "PANIC" {
        mutate {
            add_field => {
                "[log][level]" => "fatal"
            }
        }
    }

    if [postgres][message] {
        mutate {
            remove_tag => ["_postgres_parse_failure"]
        }
    }
    mutate {
        remove_field => [
            "[postgres][year]",
            "[postgres][month]",
            "[postgres][day]",
            "[postgres][time]",
            "[postgres][timezone]",
            "[postgres][timestamp]",
            "[postgres][message]",
            "postgres_level"
        ]
    }
}

output {
    elasticsearch {
        hosts => ["https://elasticsearch:9200"]
        user => "${LOGSTASH_USER}"
        password => "${LOGSTASH_PASSWORD}"
        ssl_enabled => true
        ssl_certificate_authorities => [
            "/usr/share/logstash/config/certs/ca/ca.crt"
        ]
        ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
        ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
        index => "factarena-logs-%{+YYYY.MM.dd}"
        ecs_compatibility => "v8"
    }
	
  # ==========================================================================
  # DEBUG
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}