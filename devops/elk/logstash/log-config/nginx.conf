input {
  pipeline {
    address => "nginx"
  }
}

filter {
    grok {
        match => {
            "message" => "^%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME} \[%{LOGLEVEL:[log][level]}\] %{NUMBER:[process][pid]:int}#%{NUMBER:[nginx][worker_id]:int}: %{GREEDYDATA:[nginx][message]}$"
        }

        tag_on_failure => ["_nginx_parse_failure"]
    }

    if [log][level] {
        mutate {
            lowercase => ["[log][level]"]
        }
    }

    mutate {
        remove_field => [
            "[nginx][message]"
        ]
    }
}

output {

  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca/ca.crt"
    ]
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    index => "factarena-logs-%{+YYYY.MM.dd}"
    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}