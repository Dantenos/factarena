input {
  pipeline {
    address => "nginx"
  }
}


filter {

  #
  # ============================================================
  # NGINX
  # ============================================================
  #
  if [service][name] == "nginx" {

    #
    # Conserver le log Docker original intact
    #
    mutate {
      add_field => {
        "[event][original_raw]" => "%{message}"
      }
    }

    #
    # Logs d'accès HTTP
    #
    if [message] =~ /^\d{1,3}(?:\.\d{1,3}){3} / {

      grok {
        match => {
          "message" => [
            '%{IPORHOST:[nginx][client][ip]} - %{DATA:[nginx][remote_user]} \[%{HTTPDATE:[nginx][access][timestamp]}\] "%{WORD:[http][request][method]} %{DATA:[http][request][target]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status]:int} %{INT:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}" "%{DATA:[nginx][forwarded_for]}"'
          ]
        }
        tag_on_failure => ["_nginx_access_parse_failure"]
      }

      #
      # Timestamp du log Nginx
      #
      date {
        match => [ "[nginx][access][timestamp]", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
        tag_on_failure => ["_nginx_timestamp_parse_failure"]
      }

      #
      # URL / méthode / statut
      #
      mutate {
        add_field => {
          "[event][category]" => "web"
          "[event][type]" => "access"
        }
      }

      #
      # Classification HTTP
      #
      if [http][response][status] >= 500 {
        mutate {
          replace => {
            "[event][severity]" => "error"
          }
        }
      } else if [http][response][status] >= 400 {
        mutate {
          replace => {
            "[event][severity]" => "warning"
          }
        }
      } else {
        mutate {
          replace => {
            "[event][severity]" => "info"
          }
        }
      }

      #
      # Message lisible pour Kibana
      #
      mutate {
        add_field => {
          "[short_message]" => "%{[http][request][method]} %{[http][request][target]} -> %{[http][response][status]}"
          "[long_message]" => "%{message}"
        }
      }
    }

    #
    # ========================================================
    # Logs internes Nginx
    # ========================================================
    #
    else if [message] =~ /^\d{4}\/\d{2}\/\d{2} / {

      grok {
        match => {
          "message" => [
            '%{TIMESTAMP_ISO8601:[nginx][error][timestamp]} \[%{LOGLEVEL:[nginx][error][level]}\] %{GREEDYDATA:[nginx][error][message]}'
          ]
        }
        tag_on_failure => ["_nginx_error_parse_failure"]
      }

      #
      # Classification basée sur le vrai niveau Nginx
      #
      if [nginx][error][level] == "emerg" or
         [nginx][error][level] == "alert" or
         [nginx][error][level] == "crit" or
         [nginx][error][level] == "error" {

        mutate {
          replace => {
            "[event][severity]" => "error"
          }
        }

      } else if [nginx][error][level] == "warn" {

        mutate {
          replace => {
            "[event][severity]" => "warning"
          }
        }

      } else {

        mutate {
          replace => {
            "[event][severity]" => "info"
          }
        }
      }

      mutate {
        add_field => {
          "[event][category]" => "web"
          "[event][type]" => "server"
          "[short_message]" => "%{[nginx][error][message]}"
          "[long_message]" => "%{message}"
        }
      }
    }
  }
}

output {

  elasticsearch {
    hosts => ["https://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    ssl_enabled => true

    # Vérification du certificat serveur Elasticsearch
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca/ca.crt"
    ]

    # Certificat client Logstash
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"

    # Clé privée client Logstash en PKCS#8
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}