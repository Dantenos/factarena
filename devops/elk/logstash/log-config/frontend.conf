input {
  pipeline {
    address => "frontend"
  }
}


filter {
  #
  # Identification du service
  #
  mutate {
    add_field => {
      "[service][name]" => "frontend"
    }
  }

  #
  # Conserver le log Docker original complet
  #
  if [message] {
    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }

  #
  # Le frontend Vite ne fournit pas de niveau de log.
  # On considère donc ses sorties normales comme INFO.
  #
  mutate {
    replace => {
      "[log][level]" => "info"
      "[event][severity]" => "info"
    }
  }

  #
  # Nettoyage léger du message :
  # on conserve son contenu, mais on retire uniquement
  # les espaces inutiles au début et à la fin.
  #
  mutate {
    strip => [ "message" ]
  }

  #
  # Reconnaissance des lignes Vite
  #
  if [message] =~ /^\s*➜\s+Local:/ {
    mutate {
      add_field => {
        "[event][category]" => "startup"
      }
    }
  }
  else if [message] =~ /^\s*➜\s+Network:/ {
    mutate {
      add_field => {
        "[event][category]" => "startup"
      }
    }
  }
  else if [message] =~ /^>\s+factarena-frontend@/ {
    mutate {
      add_field => {
        "[event][category]" => "startup"
      }
    }
  }
  else if [message] =~ /^>\s+vite preview/ {
    mutate {
      add_field => {
        "[event][category]" => "startup"
      }
    }
  }

  #
  # Informations supplémentaires utiles pour Kibana
  #
  mutate {
    add_field => {
      "[log][collector]" => "logstash"
      "[log][source]" => "docker"
    }
  }
}

output {

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    # ssl => true
    # ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}