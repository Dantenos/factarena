input {
  pipeline {
    address => "ai-service"
  }
}

filter {
    grok {
        match => {
            "message" => "^%{LOGLEVEL:ai_level}:\s+%{IP:client_ip}:%{NUMBER:client_port:int}\s+-\s+\"%{WORD:http_method}\s+%{URIPATHPARAM:url_path}\s+HTTP/%{NUMBER:http_version}\"\s+%{NUMBER:http_status:int}(?:\s+%{GREEDYDATA:ai_extra})?$"
        }

        tag_on_failure => ["_ai_http_parse_failure"]
    }

    if [ai_level] {

        mutate {
            lowercase => ["ai_level"]

            add_field => {
                "[log][level]" => "%{ai_level}"
                "[client][address]" => "%{client_ip}"
                "[client][port]" => "%{client_port}"
                "[http][request][method]" => "%{http_method}"
                "[http][version]" => "%{http_version}"
                "[http][response][status_code]" => "%{http_status}"
                "[url][path]" => "%{url_path}"
            }
        }

        mutate {
            convert => {
                "[client][port]" => "integer"
                "[http][response][status_code]" => "integer"
            }
        }
    }

    if "_ai_http_parse_failure" in [tags] {

        mutate {
            remove_tag => ["_ai_http_parse_failure"]
        }

        grok {
            match => {
                "message" => "^%{LOGLEVEL:ai_level}:\s+%{GREEDYDATA:ai_message}$"
            }

            tag_on_failure => ["_ai_parse_failure"]
        }

        if [ai_level] {
            mutate {
                lowercase => ["ai_level"]

                add_field => {
                    "[log][level]" => "%{ai_level}"
                }
            }
        }
    }

    mutate {
        remove_field => [
            "ai_level",
            "ai_message",
            "client_ip",
            "client_port",
            "http_method",
            "http_version",
            "http_status",
            "url_path",
            "ai_extra"
        ]
    }
}



output {

  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca/ca.crt"
    ]
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    index => "factarena-logs-%{+YYYY.MM.dd}"

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}