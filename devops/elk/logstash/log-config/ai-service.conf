input {
  pipeline {
    address => "ai-service"
  }
}

filter {

  #
  # ============================================================
  # AI SERVICE - FastAPI / Uvicorn
  # ============================================================
  #

  if [service][name] == "ai-service" {

    #
    # Garder le log reçu exactement tel quel
    #
    mutate {
      add_field => {
        "[event][original_raw]" => "%{message}"
      }
    }

    #
    # ------------------------------------------------------------
    # WARNING
    # ------------------------------------------------------------
    #
    if [message] =~ /^WARNING:\s+/ {

      grok {
        match => {
          "message" => [
            '^WARNING:\s+%{GREEDYDATA:[ai_service][message]}'
          ]
        }
        tag_on_failure => ["_ai_service_warning_parse_failure"]
      }

      mutate {
        replace => {
          "[event][severity]" => "warning"
        }

        add_field => {
          "[event][category]" => "application"
          "[event][type]" => "warning"
          "[short_message]" => "%{[ai_service][message]}"
          "[long_message]" => "%{message}"
        }
      }
    }

    #
    # ------------------------------------------------------------
    # Uvicorn INFO
    # ------------------------------------------------------------
    #
    else if [message] =~ /^INFO:\s+/ {

      #
      # Requête HTTP Uvicorn
      #
      if [message] =~ /^INFO:\s+\d{1,3}(?:\.\d{1,3}){3}:\d+\s+-\s+/ {

        grok {
          match => {
            "message" => [
              '^INFO:\s+%{IP:[ai_service][client][ip]}:%{POSINT:[ai_service][client][port]}\s+-\s+"%{WORD:[http][request][method]}\s+%{DATA:[http][request][target]}\s+HTTP/%{NUMBER:[http][version]}"\s+%{INT:[http][response][status]:int}\s+%{GREEDYDATA:[ai_service][http][message]}'
            ]
          }
          tag_on_failure => ["_ai_service_http_parse_failure"]
        }

        #
        # Classification selon le status HTTP
        #
        if [http][response][status] >= 500 {

          mutate {
            replace => {
              "[event][severity]" => "error"
            }
          }

        } else if [http][response][status] >= 400 {

          mutate {
            replace => {
              "[event][severity]" => "warning"
            }
          }

        } else {

          mutate {
            replace => {
              "[event][severity]" => "info"
            }
          }
        }

        mutate {
          add_field => {
            "[event][category]" => "web"
            "[event][type]" => "access"

            "[short_message]" => "%{[http][request][method]} %{[http][request][target]} -> %{[http][response][status]}"
            "[long_message]" => "%{message}"
          }
        }
      }

      #
      # ----------------------------------------------------------
      # INFO général Uvicorn / application
      # ----------------------------------------------------------
      #
      else {

        grok {
          match => {
            "message" => [
              '^INFO:\s+%{GREEDYDATA:[ai_service][message]}'
            ]
          }
          tag_on_failure => ["_ai_service_info_parse_failure"]
        }

        mutate {
          replace => {
            "[event][severity]" => "info"
          }

          add_field => {
            "[event][category]" => "application"
            "[event][type]" => "log"
            "[short_message]" => "%{[ai_service][message]}"
            "[long_message]" => "%{message}"
          }
        }
      }
    }

    #
    # ------------------------------------------------------------
    # Fallback
    # ------------------------------------------------------------
    #
    # Si un futur format de log apparaît et ne correspond à
    # aucun des cas précédents, on le conserve sans le casser.
    #
    else {

      mutate {
        replace => {
          "[event][severity]" => "info"
        }

        add_field => {
          "[event][category]" => "application"
          "[event][type]" => "log"
          "[short_message]" => "%{message}"
          "[long_message]" => "%{message}"
        }
      }
    }
  }
}



output {

  elasticsearch {
    hosts => ["https://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    ssl_enabled => true

    # Vérification du certificat serveur Elasticsearch
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca/ca.crt"
    ]

    # Certificat client Logstash
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"

    # Clé privée client Logstash en PKCS#8
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    index => "factarena-logs-%{+YYYY.MM.dd}"

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  stdout {
    codec => rubydebug
  }
}