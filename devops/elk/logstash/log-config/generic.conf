input {
  pipeline {
    address => "generic"
  }
}

filter {
  #
  # Service générique / fallback
  #
  if ![service][name] {
    mutate {
      add_field => {
        "[service][name]" => "generic"
      }
    }
  }

  #
  # Conserver le log reçu exactement comme message original
  #
  if [message] and ![event][original] {
    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }

  #
  # Ne définir une sévérité que si elle est réellement
  # identifiable dans le message.
  #
  if [message] =~ /(?i)^\s*(ERROR|ERR)\b/ {
    mutate {
      replace => {
        "[event][severity]" => "error"
        "[log][level]" => "error"
      }
    }
  }
  else if [message] =~ /(?i)^\s*(WARN|WARNING)\b/ {
    mutate {
      replace => {
        "[event][severity]" => "warning"
        "[log][level]" => "warning"
      }
    }
  }
  else if [message] =~ /(?i)^\s*(INFO)\b/ {
    mutate {
      replace => {
        "[event][severity]" => "info"
        "[log][level]" => "info"
      }
    }
  }
  else if [message] =~ /(?i)^\s*(DEBUG)\b/ {
    mutate {
      replace => {
        "[event][severity]" => "debug"
        "[log][level]" => "debug"
      }
    }
  }
  else if [message] =~ /(?i)^\s*(TRACE)\b/ {
    mutate {
      replace => {
        "[event][severity]" => "trace"
        "[log][level]" => "trace"
      }
    }
  }
  else {
    #
    # Important :
    # on ne transforme pas arbitrairement un log inconnu
    # en warning ou error.
    #
    mutate {
      add_field => {
        "[event][severity]" => "unknown"
      }
    }
  }

  #
  # Métadonnées Logstash
  #
  mutate {
    add_field => {
      "[log][collector]" => "logstash"
      "[log][source]" => "docker"
    }
  }
}

output {

  elasticsearch {
    hosts => ["https://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    ssl_enabled => true

    # Vérification du certificat serveur Elasticsearch
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca/ca.crt"
    ]

    # Certificat client Logstash
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"

    # Clé privée client Logstash en PKCS#8
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}