input {
  pipeline {
    address => "generic"
  }
}

filter {
  #
  # Service générique / fallback
  #
  if ![service][name] {
    mutate {
      add_field => {
        "[service][name]" => "generic"
      }
    }
  }

  #
  # Conserver le log reçu exactement comme message original
  #
  if [message] and ![event][original] {
    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }

  #
  # Ne définir une sévérité que si elle est réellement
  # identifiable dans le message.
  #
  if [message] =~ /^\s*(ERROR|ERR)\b/i {
    mutate {
      replace => {
        "[event][severity]" => "error"
        "[log][level]" => "error"
      }
    }
  }
  else if [message] =~ /^\s*(WARN|WARNING)\b/i {
    mutate {
      replace => {
        "[event][severity]" => "warning"
        "[log][level]" => "warning"
      }
    }
  }
  else if [message] =~ /^\s*(INFO)\b/i {
    mutate {
      replace => {
        "[event][severity]" => "info"
        "[log][level]" => "info"
      }
    }
  }
  else if [message] =~ /^\s*(DEBUG)\b/i {
    mutate {
      replace => {
        "[event][severity]" => "debug"
        "[log][level]" => "debug"
      }
    }
  }
  else if [message] =~ /^\s*(TRACE)\b/i {
    mutate {
      replace => {
        "[event][severity]" => "trace"
        "[log][level]" => "trace"
      }
    }
  }
  else {
    #
    # Important :
    # on ne transforme pas arbitrairement un log inconnu
    # en warning ou error.
    #
    mutate {
      add_field => {
        "[event][severity]" => "unknown"
      }
    }
  }

  #
  # Métadonnées Logstash
  #
  mutate {
    add_field => {
      "[log][collector]" => "logstash"
      "[log][source]" => "docker"
    }
  }
}

output {

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    # ssl => true
    # ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}