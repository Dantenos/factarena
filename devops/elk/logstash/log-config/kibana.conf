input {
    pipeline {
        address => "kibana"
    }
}

filter {

    grok {
        match => {
            "message" => "^\[%{TIMESTAMP_ISO8601:[kibana][timestamp]}\]\[%{LOGLEVEL:[kibana][level]}\s*\]\[%{DATA:[log][logger]}\]\s+%{GREEDYDATA:[kibana][message]}$"
        }

        tag_on_failure => ["_kibana_parse_failure"]
    }

    if [kibana][timestamp] {
        date {
            match => [
                "[kibana][timestamp]",
                "ISO8601"
            ]

            target => "@timestamp"
        }
    }

    if [kibana][level] {
        mutate {
            lowercase => ["[kibana][level]"]

            copy => {
                "[kibana][level]" => "[log][level]"
            }
        }
    }

    mutate {
        remove_field => [
            "[kibana][timestamp]",
            "[kibana][level]",
            "[kibana][message]"
        ]
    }
}

output {
    elasticsearch {
        hosts => ["https://elasticsearch:9200"]
        user => "${LOGSTASH_USER}"
        password => "${LOGSTASH_PASSWORD}"
        ssl_enabled => true
        ssl_certificate_authorities => [
            "/usr/share/logstash/config/certs/ca/ca.crt"
        ]
        ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
        ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
        index => "factarena-logs-%{+YYYY.MM.dd}"
        ecs_compatibility => "v8"
    }
    
  # ==========================================================================
  # DEBUG
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}