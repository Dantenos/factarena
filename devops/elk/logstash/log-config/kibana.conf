input {
  pipeline {
    address => "kibana"
  }
}


filter {

  # ==========================================================================
  # TIMESTAMP GELF
  # ==========================================================================

  if [timestamp] {

    date {
      match => [
        "timestamp",
        "UNIX",
        "UNIX_MS",
        "ISO8601"
      ]

      target => "@timestamp"

      tag_on_failure => [
        "_timestamp_parse_failure"
      ]
    }

    mutate {
      remove_field => [
        "timestamp"
      ]
    }
  }


  # ==========================================================================
  # KIBANA STACK TRACE AGGREGATION
  # ==========================================================================
  #
  # Kibana produit des stack traces Node.js :
  #
  #   [timestamp][WARN ][plugin] message
  #       at function (...)
  #       at function (...)
  #
  # Les lignes "at ..." sont reçues comme des événements séparés.
  #
  # On les rattache au message précédent du même conteneur.
  #

  aggregate {
    task_id => "%{[container_id]}"

    code => '
      message = event.get("message")

      if message
        if message =~ /^\s+at\b/

          if map["message"]
            map["message"] += "\n" + message
          end

          event.cancel()

        else

          if map["message"]
            event.set("message", map["message"])
          end

          map["message"] = message
        end
      end
    '

    push_map_as_event_on_timeout => true
    timeout => 2
    inactivity_timeout => 1
    timeout_task_id_field => "container_id"
    timeout_tags => [
      "_kibana_stacktrace_timeout"
    ]
  }


  # ==========================================================================
  # KIBANA LOG LEVEL
  # ==========================================================================
  #
  # Exemple :
  #
  # [2026-08-19T23:39:33.320+00:00][WARN ][plugins.fleet] ...
  #

  if [message] {

    grok {
      match => {
        "message" => [
          "^\[%{TIMESTAMP_ISO8601:[kibana][timestamp]}\]\[%{LOGLEVEL:[kibana][level]}\]"
        ]
      }

      tag_on_failure => []
    }
  }


  # ==========================================================================
  # KIBANA LEVEL -> ECS
  # ==========================================================================

  if [kibana][level] {

    mutate {
      lowercase => [
        "[kibana][level]"
      ]
    }

    if [kibana][level] in [
      "error",
      "fatal"
    ] {

      mutate {
        replace => {
          "[log][level]" => "error"
          "[event][severity]" => "error"
          "[event][type]" => "error"
        }
      }

    } else if [kibana][level] in [
      "warn",
      "warning"
    ] {

      mutate {
        replace => {
          "[log][level]" => "warning"
          "[event][severity]" => "warning"
          "[event][type]" => "warning"
        }
      }

    } else {

      mutate {
        replace => {
          "[log][level]" => "info"
          "[event][severity]" => "info"
          "[event][type]" => "log"
        }
      }
    }
  }


  # ==========================================================================
  # GENERAL METADATA
  # ==========================================================================

  mutate {
    add_field => {
      "[log][source]" => "docker"
      "[log][collector]" => "logstash"
      "[event][kind]" => "event"
    }
  }


  # ==========================================================================
  # CLEANUP
  # ==========================================================================

  mutate {
    remove_field => [
      "[kibana][timestamp]",
      "[kibana][level]"
    ]
  }
}

output {

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    # ssl => true
    # ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}