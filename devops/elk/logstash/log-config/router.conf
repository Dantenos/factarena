input {
    gelf {
        host => "0.0.0.0"
        port => 12201
        use_udp => false
        use_tcp => true
    }
}

filter {

    if [message] {
        mutate {
            copy => {
                "message" => "[event][original]"
            }
        }
    }

    if [level] {
        mutate {
            copy => {
                "level" => "[gelf][level]"
            }
        }
    }

    if [container_name] =~ /-kibana-[0-9]+$/ {
        mutate {
            add_field => {
                "[service][name]" => "kibana"
            }
        }
    }
    else if [container_name] =~ /-backend-[0-9]+$/ {
        mutate {
            add_field => {
                "[service][name]" => "backend"
            }
        }
    }
    else if [container_name] =~ /-nginx-[0-9]+$/ {
        mutate {
            add_field => {
                "[service][name]" => "nginx"
            }
        }
    }
    else if [container_name] =~ /-ai-service-[0-9]+$/ {
        mutate {
            add_field => {
                "[service][name]" => "ai-service"
            }
        }
    }
    else if [container_name] =~ /-frontend-[0-9]+$/ {
        mutate {
            add_field => {
                "[service][name]" => "frontend"
            }
        }
    }
    else if [container_name] =~ /-postgres-[0-9]+$/ {
        mutate {
            add_field => {
                "[service][name]" => "postgres"
            }
        }
    }
    else {
        mutate {
            add_field => {
                "[service][name]" => "generic"
            }
        }
    }
}

output {

    if [service][name] == "kibana" {
        pipeline {
            send_to => "kibana"
        }
    }
    else if [service][name] == "backend" {
        pipeline {
            send_to => "backend"
        }
    }
    else if [service][name] == "nginx" {
        pipeline {
            send_to => "nginx"
        }
    }
    else if [service][name] == "ai-service" {
        pipeline {
            send_to => "ai-service"
        }
    }
    else if [service][name] == "frontend" {
        pipeline {
            send_to => "frontend"
        }
    }
    else if [service][name] == "postgres" {
        pipeline {
            send_to => "postgres"
        }
    }
    else {
        pipeline {
            send_to => "generic"
        }
    }
}