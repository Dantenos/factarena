input {
    gelf {
        host => "0.0.0.0"
        port => 12201
        use_udp => false
        use_tcp => true
    }
}

filter {

    if [message] {
        mutate {
            copy => {
                "message" => "[event][original]"
            }
        }
    }

    if [level] {
        mutate {
            copy => {
                "level" => "[gelf][level]"
            }
        }
    }

    if [container_name] =~ /^transcendance-kibana-/ {
        mutate {
            add_field => {
                "[service][name]" => "kibana"
            }
        }
    }
    else if [container_name] =~ /^transcendance-backend-/ {
        mutate {
            add_field => {
                "[service][name]" => "backend"
            }
        }
    }
    else if [container_name] =~ /^transcendance-nginx-/ {
        mutate {
            add_field => {
                "[service][name]" => "nginx"
            }
        }
    }
    else if [container_name] =~ /^transcendance-ai-service-/ {
        mutate {
            add_field => {
                "[service][name]" => "ai-service"
            }
        }
    }
    else if [container_name] =~ /^transcendance-frontend-/ {
        mutate {
            add_field => {
                "[service][name]" => "frontend"
            }
        }
    }
    else if [container_name] =~ /^transcendance-postgres-/ {
        mutate {
            add_field => {
                "[service][name]" => "postgres"
            }
        }
    }
    else {
        mutate {
            add_field => {
                "[service][name]" => "generic"
            }
        }
    }
}

output {

    if [service][name] == "kibana" {
        pipeline {
            send_to => "kibana"
        }
    }
    else if [service][name] == "backend" {
        pipeline {
            send_to => "backend"
        }
    }
    else if [service][name] == "nginx" {
        pipeline {
            send_to => "nginx"
        }
    }
    else if [service][name] == "ai-service" {
        pipeline {
            send_to => "ai-service"
        }
    }
    else if [service][name] == "frontend" {
        pipeline {
            send_to => "frontend"
        }
    }
    else if [service][name] == "postgres" {
        pipeline {
            send_to => "postgres"
        }
    }
    else {
        pipeline {
            send_to => "generic"
        }
    }
}