input {
  gelf {
    host => "0.0.0.0"
    port => 12201
    use_udp => false
    use_tcp => true
  }
}

filter {

  # ==========================================================================
  # DOCKER METADATA
  # ==========================================================================

  if [tag] {

    mutate {
      copy => {
        "[tag]" => "[docker][container][name]"
      }
    }
  }


  # ==========================================================================
  # SERVICE NAME
  # ==========================================================================

  if [docker][container][name] {

    mutate {
      copy => {
        "[docker][container][name]" => "[service][name]"
      }
    }

    mutate {
      gsub => [
        "[service][name]", "^[^-]+-", "",
        "[service][name]", "-[0-9]+$", ""
      ]
    }
  }


  # ==========================================================================
  # ORIGINAL MESSAGE
  # ==========================================================================

  if [message] {

    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }

  if [message] =~ /^\s*=+\s*$/ {
    drop { }
  }
}


output {

  # ==========================================================================
  # KIBANA
  # ==========================================================================

  if [service][name] == "kibana" {

    pipeline {
      send_to => "kibana"
    }
  }

  # else {
  #   pipeline {
  #     send_to => "logstash"
  #   }
  # }

  # ==========================================================================
  # NGINX
  # ==========================================================================

  else if [service][name] == "nginx" {

    pipeline {
      send_to => "nginx"
    }
  }


  # ==========================================================================
  # BACKEND
  # ==========================================================================

  else if [service][name] == "backend" {

    pipeline {
      send_to => "backend"
    }
  }


  # ==========================================================================
  # AI SERVICE
  # ==========================================================================

  else if [service][name] == "ai-service" {

    pipeline {
      send_to => "ai-service"
    }
  }


  # ==========================================================================
  # FRONTEND
  # ==========================================================================

  else if [service][name] == "frontend" {

    pipeline {
      send_to => "frontend"
    }
  }


  # ==========================================================================
  # FALLBACK
  # ==========================================================================

  else {

    pipeline {
      send_to => "generic"
    }
  }

  
  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}