input {
    pipeline {
        address => "backend"
    }
}

filter {

    if [message] {
        mutate {
            gsub => [
                "message", "\e\[[0-9;]*m", ""
            ]
        }

    grok {
        match => {
            "message" => "^\[Nest\] %{NUMBER:[process][pid]:int}\s+-\s+(?<nest_timestamp>[0-9]{2}/[0-9]{2}/[0-9]{4}, [0-9]{2}:[0-9]{2}:[0-9]{2} [AP]M)\s+(?<nest_level>LOG|ERROR|WARN|DEBUG|VERBOSE|FATAL)\s+\[(?<nest_logger>[^\]]+)\]\s+(?<nest_message>.*)$"
        }

        tag_on_failure => ["_backend_parse_failure"]
    }

    if [nest_timestamp] {
        date {
            match => [
                "nest_timestamp",
                "MM/dd/yyyy, hh:mm:ss a"
            ]
            target => "@timestamp"
        }
    }

    if [nest_level] == "LOG" {
        mutate {
            add_field => {
                "[log][level]" => "info"
            }
        }
    }
    else if [nest_level] == "WARN" {
        mutate {
            add_field => {
                "[log][level]" => "warn"
            }
        }
    }
    else if [nest_level] == "ERROR" {
        mutate {
            add_field => {
                "[log][level]" => "error"
            }
        }
    }
    else if [nest_level] == "DEBUG" {
        mutate {
            add_field => {
                "[log][level]" => "debug"
            }
        }
    }
    else if [nest_level] == "VERBOSE" {
        mutate {
            add_field => {
                "[log][level]" => "trace"
            }
        }
    }
    else if [nest_level] == "FATAL" {
        mutate {
            add_field => {
                "[log][level]" => "fatal"
            }
        }
    }

    if [nest_logger] {
        mutate {
            add_field => {
                "[log][logger]" => "%{nest_logger}"
            }
        }
    }

    if [nest_message] {
        mutate {
            add_field => {
                "[log][message]" => "%{nest_message}"
            }

            remove_tag => [
                "_backend_parse_failure"
            ]
        }
    }

    mutate {
        remove_field => [
            "nest_timestamp",
            "nest_level",
            "nest_logger",
            "nest_message"
        ]
    }
  }
}

output {
    elasticsearch {
        hosts => ["https://elasticsearch:9200"]
        user => "${LOGSTASH_USER}"
        password => "${LOGSTASH_PASSWORD}"
        ssl_enabled => true
        ssl_certificate_authorities => [
            "/usr/share/logstash/config/certs/ca/ca.crt"
        ]
        ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
        ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
        index => "factarena-logs-%{+YYYY.MM.dd}"
        ecs_compatibility => "v8"
    }

  # ==========================================================================
  # DEBUG
  # ==========================================================================

  # stdout {
  #   codec => rubydebug
  # }
}