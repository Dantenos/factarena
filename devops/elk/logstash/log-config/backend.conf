input {
  pipeline {
    address => "backend"
  }
}

filter {

  # ==========================================================================
  # TIMESTAMP GELF
  # ==========================================================================

  if [timestamp] {

    date {
      match => [
        "timestamp",
        "UNIX",
        "UNIX_MS",
        "ISO8601"
      ]

      target => "@timestamp"

      tag_on_failure => [
        "_timestamp_parse_failure"
      ]
    }

    mutate {
      remove_field => [
        "timestamp"
      ]
    }
  }


  # ==========================================================================
  # ORIGINAL MESSAGE
  # ==========================================================================

  if [message] {

    mutate {
      copy => {
        "message" => "[event][original]"
      }
    }
  }


  # ==========================================================================
  # NESTJS LOG LEVEL
  # ==========================================================================
  #
  # Format :
  #
  # [Nest] 1 - 08/20/2026, 2:09:27 PM LOG [NestFactory] ...
  # [Nest] 1 - 08/20/2026, 2:09:27 PM WARN [Something] ...
  # [Nest] 1 - 08/20/2026, 2:09:27 PM ERROR [Something] ...
  #
  # On récupère uniquement le niveau explicite.
  #

  if [message] {

    grok {
      match => {
        "message" => [
          "^\[Nest\]\s+\d+\s+-\s+%{DATA}\s+(?<backend_level>LOG|WARN|WARNING|ERROR|DEBUG|VERBOSE|FATAL)\s"
        ]
      }

      tag_on_failure => []
    }
  }


  # ==========================================================================
  # NESTJS LEVEL -> ECS
  # ==========================================================================

  if [backend_level] {

    mutate {
      lowercase => [
        "backend_level"
      ]
    }

    # ------------------------------------------------------------------------
    # ERROR / FATAL
    # ------------------------------------------------------------------------

    if [backend_level] in [
      "error",
      "fatal"
    ] {

      mutate {
        replace => {
          "[log][level]" => "error"
          "[event][severity]" => "error"
          "[event][type]" => "error"
        }
      }

    # ------------------------------------------------------------------------
    # WARNING
    # ------------------------------------------------------------------------

    } else if [backend_level] in [
      "warn",
      "warning"
    ] {

      mutate {
        replace => {
          "[log][level]" => "warning"
          "[event][severity]" => "warning"
          "[event][type]" => "warning"
        }
      }

    # ------------------------------------------------------------------------
    # DEBUG
    # ------------------------------------------------------------------------

    } else if [backend_level] == "debug" {

      mutate {
        replace => {
          "[log][level]" => "debug"
          "[event][severity]" => "info"
          "[event][type]" => "log"
        }
      }

    # ------------------------------------------------------------------------
    # VERBOSE
    # ------------------------------------------------------------------------

    } else if [backend_level] == "verbose" {

      mutate {
        replace => {
          "[log][level]" => "debug"
          "[event][severity]" => "info"
          "[event][type]" => "log"
        }
      }

    # ------------------------------------------------------------------------
    # LOG
    # ------------------------------------------------------------------------

    } else {

      mutate {
        replace => {
          "[log][level]" => "info"
          "[event][severity]" => "info"
          "[event][type]" => "log"
        }
      }
    }
  }


  # ==========================================================================
  # NON-NESTJS BACKEND LOGS
  # ==========================================================================
  #
  # Prisma, npm, seed, etc.
  #
  # On NE déduit PAS "error" à partir du contenu du message.
  # Sans niveau explicite, on considère le log comme info.
  #

  if ![backend_level] {

    mutate {
      replace => {
        "[log][level]" => "info"
        "[event][severity]" => "info"
        "[event][type]" => "log"
      }
    }
  }


  # ==========================================================================
  # GENERAL LOG METADATA
  # ==========================================================================

  mutate {
    add_field => {
      "[log][source]" => "docker"
      "[log][collector]" => "logstash"
      "[event][kind]" => "event"
    }
  }


  # ==========================================================================
  # CLEANUP
  # ==========================================================================

  mutate {
    remove_field => [
      "backend_level"
    ]
  }
}

output {

  elasticsearch {
    hosts => ["https://elasticsearch:9200"]

    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"

    ssl_enabled => true

    # Vérification du certificat serveur Elasticsearch
    ssl_certificate_authorities => [
      "/usr/share/logstash/config/certs/ca/ca.crt"
    ]

    # Certificat client Logstash
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"

    # Clé privée client Logstash en PKCS#8
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"

    index => "factarena-logs-%{+YYYY.MM.dd}"

    ecs_compatibility => "v8"
  }

  # ==========================================================================
  # DEBUG TEMPORAIRE
  # ==========================================================================

  stdout {
    codec => rubydebug
  }
}