name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Build
        working-directory: backend
        run: npm run build

  frontend-ci:
    name: Frontend CI (React/Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  ai-service-ci:
    name: AI Service CI (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        working-directory: ai-service
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        working-directory: ai-service
        run: python -m pytest

  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create validation environment
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          POSTGRES_PASSWORD=ci_postgres_password
          JWT_SECRET=ci_jwt_secret
          ELASTIC_PASSWORD=ci_elastic_password
          KIBANA_PASSWORD=ci_kibana_password
          LOGSTASH_PASSWORD=ci_logstash_password
          GRAFANA_PASSWORD=ci_grafana_password
          EOF
          
      - name: Validate production Compose
        run: |
          docker compose config
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config

  elasticsearch-config-validate:
    name: Validate Elasticsearch Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Elasticsearch JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("devops/elasticsearch")

          files = list(root.rglob("*.json"))

          if not files:
              raise SystemExit("No Elasticsearch JSON configuration found.")

          for path in files:
              print(f"Validating {path}")
              with path.open(encoding="utf-8") as f:
                  json.load(f)

          print(f"Validated {len(files)} JSON file(s).")
          PY


  logstash-config-validate:
    name: Validate Logstash Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Logstash configuration
        run: |
          docker run --rm \
            -v "$PWD/devops/logstash:/usr/share/logstash/pipeline:ro" \
            docker.elastic.co/logstash/logstash:9.5.1 \
            logstash \
              --path.settings /usr/share/logstash/config \
              --config.test_and_exit

# - **What it does**:
#   This file defines the **GitHub Actions workflow** that runs automatically when code is pushed to the `main` branch or a pull request is opened.
#   - **Linting**: Checks for code style and formatting issues.
#   - **Building**: Compiles the app or runs tests.
#   - **Testing**: Runs unit/integration tests to ensure code works as expected.
#   - **Deployment**: Builds and pushes Docker images to a registry (if configured).

# - **Security Note**:
#   This file **does not contain secrets**. Any sensitive data (like Docker credentials) are stored in **GitHub Secrets**, not in the code.
#   - Example: `secrets.DOCKER_REGISTRY_PASSWORD` is used in the workflow to push Docker images.
#   - **Never commit GitHub Secrets to the repo** — they are stored securely in GitHub itself.
