  # ----------------------------------------------------------
  # PostgreSQL backup
  # ----------------------------------------------------------
  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-factarena}
      BACKUP_INTERVAL_SECONDS: 86400 # 24 heures
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c", "while true; do /scripts/backup.sh; sleep $$BACKUP_INTERVAL_SECONDS; done"]
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Reverse proxy nginx : (443).
  # ----------------------------------------------------------
  nginx:
    build: ./nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      kibana:
        condition: service_healthy
      # grafana:
      #   condition: service_healthy
      logstash:
        condition: service_healthy
    ports:
      - "443:443"
    # Idem : nginx aussi écoute en 0.0.0.0:80, donc IPv4. On sonde 127.0.0.1.
    # C'est la sonde /healthz du bloc « server » sur le port 80 (voir nginx.conf) :
    # elle répond en clair, sans redirection, uniquement pour Docker.
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - factarena
      - elk
    restart: unless-stopped

# ------------------------------------------------------------
# Réseaux privé
# ------------------------------------------------------------
networks:
  factarena:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  elk:
    driver: bridge
    internal: true

# ------------------------------------------------------------
# Volumes persistants
# ------------------------------------------------------------
volumes:
  postgres_data:
  elasticsearch_data:
  elasticsearch_snapshots:
  prometheus_data:
  grafana_data:
