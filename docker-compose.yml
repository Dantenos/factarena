# ============================================================
# ft_transcendence — FactArena
# Orchestration des services. Objectif du sujet : « docker compose up --build »
# démarre TOUT en une seule commande.
#
# Règle d'architecture : SEUL nginx publie un port sur l'hôte (443). Tous les
# autres services dialoguent sur le réseau docker interne « factarena »
# ============================================================

services:
  # ----------------------------------------------------------
  # Base de données : PostgreSQL + pgvector.
  # Image pgvector (Postgres + extension vectorielle) car le service IA en aura
  # besoin plus tard pour le RAG
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    # Les variables ${...} sont référencées depuis .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-factarena}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persistance des données
      # Postgres joue tout seul les scripts .sql qu'il trouve dans ce dossier,
      # mais UNIQUEMENT quand il crée une base vide. C'est comme ça que
      # j'active pgvector sans que personne ait à taper quoi que ce soit à la
      # main (le sujet exige un démarrage en une seule commande).
      # :ro = lecture seule, Postgres n'a aucune raison d'écrire dans nos scripts.
      # Détails dans postgres/init/01-pgvector.sql.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # les autres services attendent que la base réponde vraiment car deux services sont interdépendents.
    # PostgreSQL doit être prêt avant que Node.js ne démarre. Node.js doit être prêt avant que Python) ne tente d'appeler l'API
    # c'est pourquoi il y a autant de healthcheck (un par service)
    depends_on:
      logstash:
        condition: service_healthy
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-factarena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend cœur : NestJS (auth, salons, jeu, WebSocket, API).
  # Écoute sur 3000. Applique les migrations Prisma au démarrage.
  # ----------------------------------------------------------
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL} # Prisma (hôte = « postgres », nom du service)
      JWT_SECRET: ${JWT_SECRET}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_CALLBACK_URL: ${FORTYTWO_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL} # adresse interne du service IA
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "3000" # seul nginx y accède
    volumes:
      - backend_uploads:/app/uploads
    # Healthcheck sur /api/health.
    # ATTENTION : j'écris 127.0.0.1 et surtout PAS localhost. Dans un conteneur,
    # « localhost » a deux adresses possibles : ::1 (IPv6) et 127.0.0.1 (IPv4),
    # et wget essaie l'IPv6 en premier. Or Nest écoute sur 0.0.0.0, qui ne couvre
    # QUE l'IPv4 : wget frappe donc à une porte qui n'existe pas et se prend un
    # « Connection refused ». Le service passe unhealthy, et comme nginx l'attend
    # (depends_on plus bas), il ne démarre jamais. Je me suis fait avoir pendant
    # un moment, d'où le pavé : ne remettez pas « localhost » ici.
    # Le http:// est volontaire : on est À L'INTÉRIEUR du conteneur, et le sujet
    # n'impose le chiffrement que pour le trafic qui vient du navigateur.
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend IA : FastAPI RAG/LLM/
  # ----------------------------------------------------------
  ai-service:
    build: ./ai-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "8000"
    # pour python:slim on sonde /health via urllib.
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # CONFIGURATION FRONTEND (React)
  # --------------------------------------------------------------------------
  # J'utilise « vite preview » pour servir le frontend sur le port 4173.
  # Quand Nginx frappe à la porte 4173, c'est le concierge Vite preview qui répond et qui donne les pages de ton site aux visiteurs.
  #  Nginx :
  # Il sert de pont. Il reçoit toutes les requêtes :
  # - Si ça demande "/" : il envoie vers le front.
  # - Si ça demande "/api" : il renvoie vers le backend.
  # ----------------------------------------------------------
  frontend:
    build: ./frontend
    expose:
      - "4173"
    depends_on:
      logstash:
        condition: service_healthy
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factarena
    restart: unless-stopped


  # ==========================================================
  # DEVOPS : ELK STACK
  # ==========================================================

  cert-generator:
    build:
      context: ./devops/elk/cert-generator
      dockerfile: Dockerfile
    container_name: cert-generator
    volumes:
      - ./devops/elk/certs:/certs
    restart: "no"

  # ==========================================================================
  # DEVOPS : Elasticsearch (store and index logs)
  # ==========================================================================

  elasticsearch:
    build:
      context: ./devops/elk/elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: '["/snapshots"]'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_snapshots:/snapshots
      - ./devops/elk/certs/ca/ca.crt:/usr/share/elasticsearch/config/certs/ca/ca.crt:ro
      - ./devops/elk/certs/elasticsearch/elasticsearch.crt:/usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.crt:ro
      - ./devops/elk/certs/elasticsearch/elasticsearch.key:/usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.key:ro
      - ./devops/elk/certs/healthchecker:/usr/share/elasticsearch/config/certs/healthchecker:ro
    expose:
      - "9200"
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - >
        curl -fs
        --cacert /usr/share/elasticsearch/config/certs/ca/ca.crt
        --cert /usr/share/elasticsearch/config/certs/healthchecker/healthchecker.crt
        --key /usr/share/elasticsearch/config/certs/healthchecker/healthchecker.key
        -u "elastic:$${ELASTIC_PASSWORD}"
        https://elasticsearch:9200/_cluster/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - elk
    restart: unless-stopped

  # ==========================================================================
  # DEVOPS : Logstash (Collect & Transform logs)
  # ==========================================================================

  logstash:
    build:
      context: ./devops/elk/logstash
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      LOGSTASH_USER: ${LOGSTASH_USER}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
    volumes:
      - ./devops/elk/logstash/init-logstash.sh:/usr/local/bin/init-logstash.sh:ro
      - ./devops/elk/elasticsearch/security/logstash-role.json:/usr/local/share/logstash/logstash-role.json:ro
      - ./devops/elk/certs/ca/ca.crt:/usr/share/logstash/config/certs/ca/ca.crt:ro
      - ./devops/elk/certs/logstash/logstash.crt:/usr/share/logstash/config/certs/logstash/logstash.crt:ro
      - ./devops/elk/certs/logstash/logstash.pkcs8.key:/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key:ro
    expose:
      - "12201/tcp"
      - "9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "cat /proc/net/tcp /proc/net/tcp6 | grep -qi ':2FA9.*0A'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      factarena:
        ipv4_address: 172.30.0.10
      elk:
    restart: unless-stopped

  # ==========================================================================
  # DEVOPS : Kibana (Visualisation & Dashboards)
  # ==========================================================================

  kibana:
    build:
      context: ./devops/elk/kibana
    environment:
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${KIBANA_USER}
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?KIBANA_PASSWORD must be set in .env}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?KIBANA_PASSWORD must be set in .env}
      KIBANA_APP_USER: ${KIBANA_APP_USER}
      KIBANA_APP_PASSWORD: ${KIBANA_APP_PASSWORD}
      KIBANA_SECURITY_ENCRYPTION_KEY: ${KIBANA_SECURITY_ENCRYPTION_KEY}
      KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY: ${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY}
      KIBANA_REPORTING_ENCRYPTION_KEY: ${KIBANA_REPORTING_ENCRYPTION_KEY}
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
    volumes:
      - ./devops/elk/elasticsearch/security/kibana-user-role.json:/usr/local/share/kibana/kibana-user-role.json:ro
      - ./devops/elk/certs/ca/ca.crt:/usr/share/kibana/config/certs/ca/ca.crt:ro
      - ./devops/elk/certs/kibana/kibana-server.crt:/usr/share/kibana/config/certs/kibana/kibana-server.crt:ro
      - ./devops/elk/certs/kibana/kibana-server.key:/usr/share/kibana/config/certs/kibana/kibana-server.key:ro
      - ./devops/elk/certs/kibana/kibana-client.crt:/usr/share/kibana/config/certs/kibana/kibana-client.crt:ro
      - ./devops/elk/certs/kibana/kibana-client.key:/usr/share/kibana/config/certs/kibana/kibana-client.key:ro
      - ./devops/elk/certs/healthchecker:/usr/share/kibana/config/certs/healthchecker:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "5601"
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test:
      - CMD-SHELL
      - >
        curl -fsS
        --cacert /usr/share/kibana/config/certs/ca/ca.crt
        --cert /usr/share/kibana/config/certs/healthchecker/healthchecker.crt
        --key /usr/share/kibana/config/certs/healthchecker/healthchecker.key
        https://kibana:5601/kibana/api/status >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - elk
    restart: unless-stopped

  # ----------------------------------------------------------
  # Reverse proxy nginx : (443).
  # ----------------------------------------------------------
  nginx:
    build: ./nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      kibana:
        condition: service_healthy
    ports:
      - "443:443"
    # Idem : nginx aussi écoute en 0.0.0.0:80, donc IPv4. On sonde 127.0.0.1.
    # C'est la sonde /healthz du bloc « server » sur le port 80 (voir nginx.conf) :
    # elle répond en clair, sans redirection, uniquement pour Docker.
    volumes:
      - ./devops/elk/certs/ca/ca.crt:/etc/nginx/certs/ca/ca.crt:ro
      - ./devops/elk/certs/nginx/nginx-server.crt:/etc/nginx/certs/nginx/nginx-server.crt:ro
      - ./devops/elk/certs/nginx/nginx-server.key:/etc/nginx/certs/nginx/nginx-server.key:ro
      - ./devops/elk/certs/nginx/nginx-client.crt:/etc/nginx/certs/nginx/nginx-client.crt:ro
      - ./devops/elk/certs/nginx/nginx-client.key:/etc/nginx/certs/nginx/nginx-client.key:ro
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider https://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - factarena
      - elk
    restart: unless-stopped

# ------------------------------------------------------------
# Réseaux privé
# ------------------------------------------------------------
networks:
  factarena:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  elk:
    driver: bridge
    internal: true

# ------------------------------------------------------------
# Volumes persistants
# ------------------------------------------------------------
volumes:
  postgres_data:
  elasticsearch_data:
  elasticsearch_snapshots:
  prometheus_data:
  grafana_data:
  backend_uploads:
