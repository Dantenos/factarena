# ============================================================
# ft_transcendence — FactArena
# Orchestration des 5 services. Objectif du sujet : « docker compose up --build »
# démarre TOUT en une seule commande.
#
# Règle d'architecture : SEUL nginx publie un port sur l'hôte (443). Tous les
# autres services dialoguent sur le réseau docker interne « factarena »
# ============================================================

services:
  # ----------------------------------------------------------
  # Base de données : PostgreSQL + pgvector.
  # Image pgvector (Postgres + extension vectorielle) car le service IA en aura
  # besoin plus tard pour le RAG.
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    # Les variables ${...} sont référencées depuis .env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persistance des données
      # Postgres joue tout seul les scripts .sql qu'il trouve dans ce dossier,
      # mais UNIQUEMENT quand il crée une base vide. C'est comme ça que
      # j'active pgvector sans que personne ait à taper quoi que ce soit à la
      # main (le sujet exige un démarrage en une seule commande).
      # :ro = lecture seule, Postgres n'a aucune raison d'écrire dans nos scripts.
      # Détails dans postgres/init/01-pgvector.sql.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # les autres services attendent que la base réponde vraiment car deux services sont interdépendents.
    # PostgreSQL doit être prêt avant que Node.js ne démarre. Node.js doit être prêt avant que Python) ne tente d'appeler l'API
    # c'est pourquoi il y a autant de healthcheck (un par service)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend cœur : NestJS (auth, salons, jeu, WebSocket, API).
  # Écoute sur 3000. Applique les migrations Prisma au démarrage.
  # ----------------------------------------------------------
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL} # Prisma (hôte = « postgres », nom du service)
      JWT_SECRET: ${JWT_SECRET}
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      FT_CALLBACK_URL: ${FT_CALLBACK_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL} # adresse interne du service IA
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000" # seul nginx y accède
    # Healthcheck sur /api/health.
    # ATTENTION : j'écris 127.0.0.1 et surtout PAS localhost. Dans un conteneur,
    # « localhost » a deux adresses possibles : ::1 (IPv6) et 127.0.0.1 (IPv4),
    # et wget essaie l'IPv6 en premier. Or Nest écoute sur 0.0.0.0, qui ne couvre
    # QUE l'IPv4 : wget frappe donc à une porte qui n'existe pas et se prend un
    # « Connection refused ». Le service passe unhealthy, et comme nginx l'attend
    # (depends_on plus bas), il ne démarre jamais. Je me suis fait avoir pendant
    # un moment, d'où le pavé : ne remettez pas « localhost » ici.
    # Le http:// est volontaire : on est À L'INTÉRIEUR du conteneur, et le sujet
    # n'impose le chiffrement que pour le trafic qui vient du navigateur.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend IA : FastAPI RAG/LLM/
  # ----------------------------------------------------------
  ai-service:
    build: ./ai-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    # pour python:slim on sonde /health via urllib.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
# CONFIGURATION FRONTEND (React)
# --------------------------------------------------------------------------
# J'utilise « vite preview » pour servir le frontend sur le port 4173.
# Quand Nginx frappe à la porte 4173, c'est le concierge Vite preview qui répond et qui donne les pages de ton site aux visiteurs.
#  Nginx :
# Il sert de pont. Il reçoit toutes les requêtes :
# - Si ça demande "/" : il envoie vers le front.
# - Si ça demande "/api" : il renvoie vers le backend.
# ----------------------------------------------------------
  frontend:
    build: ./frontend
    expose:
      - "4173"
    # Même piège IPv6 que pour le backend (voir mon explication plus haut) :
    # vite preview écoute sur 0.0.0.0, donc en IPv4 uniquement. Avec
    # « localhost », wget partirait sur ::1 et le service resterait unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Reverse proxy nginx :  (443).
  # - Proxifie / vers le frontend et /api, /socket.io vers le backend.
  # ----------------------------------------------------------
  nginx:
    build: ./nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "443:443"
    # Idem : nginx aussi écoute en 0.0.0.0:80, donc IPv4. On sonde 127.0.0.1.
    # C'est la sonde /healthz du bloc « server » sur le port 80 (voir nginx.conf) :
    # elle répond en clair, sans redirection, uniquement pour Docker.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - factarena
    restart: unless-stopped

# ------------------------------------------------------------
# Réseau privé
# ------------------------------------------------------------
networks:
  factarena:
    driver: bridge

# ------------------------------------------------------------
# Volume nommé persistant pour les données PostgreSQL.
# ------------------------------------------------------------
volumes:
  postgres_data:
