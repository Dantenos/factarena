# ============================================================
# ft_transcendence — FactArena
# Orchestration des services. Objectif du sujet : « docker compose up --build »
# démarre TOUT en une seule commande.
#
# Règle d'architecture : SEUL nginx publie un port sur l'hôte (443). Tous les
# autres services dialoguent sur le réseau docker interne « factarena »
# ============================================================

services:
  # ----------------------------------------------------------
  # Base de données : PostgreSQL + pgvector.
  # Image pgvector (Postgres + extension vectorielle) car le service IA en aura
  # besoin plus tard pour le RAG
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    # Les variables ${...} sont référencées depuis .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-factarena}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persistance des données
      # Postgres joue tout seul les scripts .sql qu'il trouve dans ce dossier,
      # mais UNIQUEMENT quand il crée une base vide. C'est comme ça que
      # j'active pgvector sans que personne ait à taper quoi que ce soit à la
      # main (le sujet exige un démarrage en une seule commande).
      # :ro = lecture seule, Postgres n'a aucune raison d'écrire dans nos scripts.
      # Détails dans postgres/init/01-pgvector.sql.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # les autres services attendent que la base réponde vraiment car deux services sont interdépendents.
    # PostgreSQL doit être prêt avant que Node.js ne démarre. Node.js doit être prêt avant que Python) ne tente d'appeler l'API
    # c'est pourquoi il y a autant de healthcheck (un par service)
    depends_on:
      logstash:
        condition: service_healthy
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-factarena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend cœur : NestJS (auth, salons, jeu, WebSocket, API).
  # Écoute sur 3000. Applique les migrations Prisma au démarrage.
  # ----------------------------------------------------------
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL} # Prisma (hôte = « postgres », nom du service)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      FT_CALLBACK_URL: ${FT_CALLBACK_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL} # adresse interne du service IA
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "3000" # seul nginx y accède
    # Healthcheck sur /api/health.
    # ATTENTION : j'écris 127.0.0.1 et surtout PAS localhost. Dans un conteneur,
    # « localhost » a deux adresses possibles : ::1 (IPv6) et 127.0.0.1 (IPv4),
    # et wget essaie l'IPv6 en premier. Or Nest écoute sur 0.0.0.0, qui ne couvre
    # QUE l'IPv4 : wget frappe donc à une porte qui n'existe pas et se prend un
    # « Connection refused ». Le service passe unhealthy, et comme nginx l'attend
    # (depends_on plus bas), il ne démarre jamais. Je me suis fait avoir pendant
    # un moment, d'où le pavé : ne remettez pas « localhost » ici.
    # Le http:// est volontaire : on est À L'INTÉRIEUR du conteneur, et le sujet
    # n'impose le chiffrement que pour le trafic qui vient du navigateur.
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend IA : FastAPI RAG/LLM/
  # ----------------------------------------------------------
  ai-service:
    build: ./ai-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "8000"
    # pour python:slim on sonde /health via urllib.
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # CONFIGURATION FRONTEND (React)
  # --------------------------------------------------------------------------
  # J'utilise « vite preview » pour servir le frontend sur le port 4173.
  # Quand Nginx frappe à la porte 4173, c'est le concierge Vite preview qui répond et qui donne les pages de ton site aux visiteurs.
  #  Nginx :
  # Il sert de pont. Il reçoit toutes les requêtes :
  # - Si ça demande "/" : il envoie vers le front.
  # - Si ça demande "/api" : il renvoie vers le backend.
  # ----------------------------------------------------------
  frontend:
    build: ./frontend
    expose:
      - "4173"
    depends_on:
      logstash:
        condition: service_healthy
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factarena
    restart: unless-stopped


  # ==========================================================
  # DEVOPS : ELK STACK
  # ==========================================================

  # ==========================================================================
  # DEVOPS : Elasticsearch (store and index logs)
  # ==========================================================================

  elasticsearch-snapshots-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    user: root
    volumes:
      - elasticsearch_snapshots:/snapshots
      - ./devops/elk/elasticsearch/init-snapshots.sh:/usr/local/bin/init-snapshots.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-snapshots.sh"]
    restart: "no"
    networks:
      - elk

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      path.repo: '["/snapshots"]'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_snapshots:/snapshots
    expose:
      - "9200"
    depends_on:
      elasticsearch-snapshots-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_security/_authenticate >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - elk
    restart: unless-stopped

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?LOGSTASH_PASSWORD must be set in .env}
    volumes:
      - ./devops/elk/elasticsearch/ilm:/usr/local/share/elasticsearch-config/ilm:ro
      - ./devops/elk/elasticsearch/templates:/usr/local/share/elasticsearch-config/templates:ro
      - ./devops/elk/elasticsearch/snapshots:/usr/local/share/elasticsearch-config/snapshots:ro
      - ./devops/elk/elasticsearch/security:/usr/local/share/elasticsearch-config/security:ro
      - ./devops/elk/elasticsearch/init-elasticsearch.sh:/usr/local/bin/init-elasticsearch.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-elasticsearch.sh"]
    networks:
      - elk
    restart: "no"

  # ==========================================================================
  # DEVOPS : Logstash (Collect & Transform logs)
  # ==========================================================================

  logstash:
    build:
      context: ./devops/elk/logstash
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      LOGSTASH_USER: ${LOGSTASH_USER}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
    volumes:
      - ./devops/elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    expose:
      - "12201/tcp"
      - "9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "cat /proc/net/tcp /proc/net/tcp6 | grep -qi ':2FA9.*0A'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      factarena:
        ipv4_address: 172.30.0.10
      elk:
    restart: unless-stopped

  # ==========================================================================
  # DEVOPS : Kibana (Visualisation & Dashboards)
  # ==========================================================================

  kibana:
    build:
      context: ./devops/elk/kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${KIBANA_USER}
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?KIBANA_PASSWORD must be set in .env}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?ELASTIC_PASSWORD must be set in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?KIBANA_PASSWORD must be set in .env}
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
    volumes:
      - ./devops/elk/kibana/dashboard-demo.ndjson:/usr/share/kibana/config/dashboard.ndjson:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy
    expose:
      - "5601"
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://172.30.0.10:12201"
        gelf-tcp-max-reconnect: "10"
        gelf-tcp-reconnect-delay: "1"
        tag: "{{.Name}}"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fs http://127.0.0.1:5601/kibana/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - elk
    restart: unless-stopped

