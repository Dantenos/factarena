# ============================================================
# ft_transcendence — FactArena
# Orchestration des services. Objectif du sujet : « docker compose up --build »
# démarre TOUT en une seule commande.
#
# Règle d'architecture : SEUL nginx publie un port sur l'hôte (443). Tous les
# autres services dialoguent sur le réseau docker interne « factarena »
# ============================================================

services:
  # ----------------------------------------------------------
  # Base de données : PostgreSQL + pgvector.
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-factarena}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-factarena}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend cœur : NestJS (auth, salons, jeu, WebSocket, API).
  # ----------------------------------------------------------
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      FT_CALLBACK_URL: ${FT_CALLBACK_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Backend IA : FastAPI RAG/LLM
  # ----------------------------------------------------------
  ai-service:
    build: ./ai-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # CONFIGURATION FRONTEND (React)
  # ----------------------------------------------------------
  frontend:
    build: ./frontend
    expose:
      - "4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # ELK STACK: Elasticsearch (Stockage & Indexation)
  # ----------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # ELK STACK: Logstash (Collecte & Transformation)
  # ----------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # ELK STACK: Kibana (Visualisation & Dashboards)
  # ----------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    expose:
      - "5601"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # MONITORING: Prometheus (Collecte de métriques)
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - "9090"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # MONITORING: Grafana (Visualisation & Alertes)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_secure_password}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # SAUVEGARDES AUTOMATIQUES (Disaster Recovery)
  # ----------------------------------------------------------
  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-factarena}
      BACKUP_INTERVAL_SECONDS: 86400 # 24 heures
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "-c", "while true; do /scripts/backup.sh; sleep $$BACKUP_INTERVAL_SECONDS; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - factarena
    restart: unless-stopped

  # ----------------------------------------------------------
  # Reverse proxy nginx : (443).
  # ----------------------------------------------------------
  nginx:
    build: ./nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      kibana:
        condition: service_healthy
      grafana:
        condition: service_healthy
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - factarena
    restart: unless-stopped

# ------------------------------------------------------------
# Réseaux & Volumes
# ------------------------------------------------------------
networks:
  factarena:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
