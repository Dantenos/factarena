# ============================================================
# Configuration nginx — FactArena
# - Termine le TLS (HTTPS/WSS) pour tout le trafic navigateur.
# - Proxifie / vers le service frontend (SPA React servi par vite preview).
# - Proxifie /api et /socket.io vers le backend (NestJS) sur le réseau interne.
# ============================================================

# ------------------------------------------------------------
# Petit aiguillage : il décide quoi mettre dans l'en-tête « Connection » selon
# que le client demande ou non à passer en WebSocket.
#   - le client envoie un en-tête Upgrade (= il veut un WebSocket) -> « upgrade »
#   - requête HTTP normale (Upgrade vide)                          -> « close »
#
# POURQUOI cet aiguillage plutôt qu'écrire « Connection upgrade » en dur :
# parce qu'on casserait toutes les requêtes HTTP classiques, qui n'ont rien à
# upgrader du tout. Là, chaque requête reçoit l'en-tête qui la concerne.
#
# À quoi ça sert : au rechargement à chaud (HMR) de vite dev, qui passe par un
# WebSocket (voir docker-compose.dev.yml). En prod on tourne avec vite preview,
# qui n'ouvre aucun WebSocket : cet aiguillage ne sert alors à rien, il dort.
# ------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------
# Devops' config to get logs to GELF for ELK's services
# ------------------------------------------------------------
access_log /dev/stdout main;
error_log /dev/stderr warn;

# ------------------------------------------------------------
# Serveur HTTP (port 80, NON publié sur l'hôte).
# Sert uniquement à : (1) fournir une sonde /healthz au healthcheck Docker,
# (2) rediriger vers HTTPS toute requête qui arriverait en clair.
# ------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Sonde interne du healthcheck (réponse en clair, sans redirection).
    location = /healthz {
        return 200 "ok\n";
    }

    # Tout le reste -> HTTPS (le sujet exige le chiffrement du trafic navigateur).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# Serveur HTTPS (port 443, SEUL port publié).
# ------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on; # HTTP/2 : chargement du SPA plus rapide
    server_name _;

    # Certificat auto-signé généré au build (voir nginx/Dockerfile).
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_certificate /etc/nginx/certs/nginx/nginx-server.crt;
    ssl_certificate_key /etc/nginx/certs/nginx/nginx-server.key;

    # HSTS volontairement DÉSACTIVÉ en dev : avec un certificat auto-signé,
    # épingler HSTS peut bloquer les rechargements de page (Chrome refuse alors
    # le cert invalide sans échappatoire). À activer UNIQUEMENT avec un vrai
    # certificat signé par une CA.

    # Taille max des corps de requête (uploads d'avatar/image plus tard).
    # Défaut nginx = 1 Mo (trop bas) -> on relève à 10 Mo.
    client_max_body_size 10m;

    # --- API REST -> backend (NestJS, 3000) ---
    # On CONSERVE le préfixe /api (proxy_pass sans URI). Le backend déclare
    # app.setGlobalPrefix('api'), donc /api/health -> route Nest /api/health.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (Socket.IO) -> backend, en WSS ---
    # Les en-têtes Upgrade/Connection sont indispensables au passage HTTP -> WS.
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une partie peut rester silencieuse > 60s (pause, onglet en fond) :
        # on relève les timeouts pour ne pas couper le WebSocket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Tout le reste -> le SPA (service frontend, vite preview sur 4173) ---
    # Le fallback SPA (routes React inconnues -> index.html) est géré par
    # vite preview lui-même.
    location / {
        proxy_pass http://frontend:4173;
        # Ces trois lignes laissent passer les WebSockets vers le front.
        # En mode dev, le rechargement à chaud de Vite ouvre un WebSocket sur
        # « / » : sans elles, nginx le refuse, le navigateur retente en boucle
        # et la console se remplit d'erreurs (or le sujet en exige zéro).
        # En prod, vite preview n'ouvre aucun WebSocket : elles ne changent
        # rien. C'est l'aiguillage $connection_upgrade en haut du fichier qui
        # fait que ça reste sans effet sur les requêtes HTTP normales.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Kibana (ELK Stack) ---
    location /kibana/ {
        proxy_pass https://kibana:5601;

        # --------------------------------------------------------
        # Vérification du certificat serveur de Kibana
        # --------------------------------------------------------

        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca/ca.crt;
        proxy_ssl_verify_depth 2;

        # Le nom utilisé pour vérifier le certificat Kibana
        proxy_ssl_name kibana;

        # --------------------------------------------------------
        # Certificat client Nginx présenté à Kibana
        # --------------------------------------------------------

        proxy_ssl_certificate /etc/nginx/certs/nginx/nginx-client.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/nginx/nginx-client.key;

        # --------------------------------------------------------
        # Headers reverse proxy
        # --------------------------------------------------------

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }  
}