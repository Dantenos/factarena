# ============================================================
# SURCOUCHE DE DÉVELOPPEMENT — le rechargement à chaud, pour bosser au quotidien.
# ============================================================

services:
  # ----------------------------------------------------------
  # Le front : on lance « vite dev » au lieu de « vite preview ».
  # ----------------------------------------------------------
  frontend:
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  # ----------------------------------------------------------
  # Le back : Nest en mode watch, il redémarre seul à chaque sauvegarde.
  # ----------------------------------------------------------
  backend:
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: ["sh", "-c", "npx prisma db push --skip-generate && npm run start:dev"]

  # ----------------------------------------------------------
  # Le service IA : uvicorn en mode --reload
  # ----------------------------------------------------------
  ai-service:
    volumes:
      - ./ai-service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
