input {
  tcp {
    port => 5000
    codec => json
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # Optionnel : ajouter des transformations ou enrichissements de logs ici
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "factarena-logs-%{+YYYY.MM.dd}"
    # Politique de rétention : ILM (Index Lifecycle Management) gère la suppression automatique après 30 jours
    ilm_enabled => true
    ilm_policy => "30-days-retention"
    ilm_rollover_alias => "factarena-logs"
  }
}
